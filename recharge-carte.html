<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveCash - Recharger la Carte</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e293b 0%, #0b1329 100%);
      color: #ffffff;
      padding: 16px;
      max-width: 440px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Top Header */
    .top-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .btn-back {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #ffffff;
      text-decoration: none;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .btn-back:active {
      transform: scale(0.95);
    }

    .page-title {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(90deg, #ffffff, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Vizyèl Kat Visa Modèn (Glassmorphism) */
    .visa-card-container {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 24px;
      padding: 22px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      margin-bottom: 24px;
    }

    .visa-card-container::before {
      content: '';
      position: absolute;
      top: -40px;
      right: -40px;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, transparent 70%);
      border-radius: 50%;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .chip-icon {
      width: 38px;
      height: 28px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-radius: 6px;
      position: relative;
    }

    .visa-logo {
      font-size: 22px;
      font-weight: 900;
      font-style: italic;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .card-balance-label {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card-balance-val {
      font-size: 30px;
      font-weight: 800;
      color: #38bdf8;
      margin: 4px 0 14px 0;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    .card-holder {
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Bwat Solde Prensipal LiveCash */
    .source-wallet-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .wallet-info-title {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .wallet-info-val {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      margin-top: 2px;
    }

    .wallet-badge {
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    /* Section Input Rechaj */
    .recharge-form {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 10px;
      display: block;
    }

    .input-box {
      position: relative;
      margin-bottom: 12px;
    }

    .input-box input {
      width: 100%;
      background: #090e1a;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      padding-right: 80px;
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-box input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }

    .currency-suffix {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      font-weight: 800;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 6px 10px;
      border-radius: 8px;
    }

    /* Bouton Ranpli Rapid (Quick Add) */
    .quick-amounts {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .quick-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .quick-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border-color: #38bdf8;
    }

    /* Detay Frè ak Kalkil */
    .fee-summary {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
    }

    .summary-row strong {
      color: #ffffff;
    }

    .summary-row.total strong {
      color: #38bdf8;
      font-size: 13px;
    }

    /* Bouton Valide ak Koulè Glow */
    .btn-submit-recharge {
      width: 100%;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
      transition: all 0.2s ease;
    }

    .btn-submit-recharge:active {
      transform: scale(0.98);
      box-shadow: 0 5px 15px rgba(56, 189, 248, 0.2);
    }
  </style>
</head>
<body>

  <!-- Header Nav -->
  <div class="top-header">
    <a href="index.html" class="btn-back">←</a>
    <div class="page-title">Recharger Carte Visa</div>
  </div>

  <!-- Vizyèl Kat Visa Virtuèl (Anlè) -->
  <div class="visa-card-container">
    <div class="card-top">
      <div class="chip-icon"></div>
      <div class="visa-logo">VISA</div>
    </div>
    <div class="card-balance-label">Solde actuel de la carte</div>
    <div class="card-balance-val" id="cardBalanceDisplay">$497.02 USD</div>
    <div class="card-holder" id="cardHolderDisplay">KERBY BRUNVIL</div>
  </div>

  <!-- Sous: Balans Prensipal LiveCash -->
  <div class="source-wallet-card">
    <div>
      <div class="wallet-info-title">Depuis le solde LiveCash</div>
      <div class="wallet-info-val" id="livecashBalanceDisplay">$500.00 USD (69,000 HTG)</div>
    </div>
    <div class="wallet-badge">Disponible</div>
  </div>

  <!-- Formulaire de recharge -->
  <div class="recharge-form">
    <label class="form-label" for="rechargeInput">Montant à recharger (USD)</label>
    
    <div class="input-box">
      <input type="number" id="rechargeInput" placeholder="0.00" min="5" oninput="updateCalculations()">
      <span class="currency-suffix">USDT</span>
    </div>

    <!-- Bouton ranpli rapid -->
    <div class="quick-amounts">
      <button class="quick-btn" onclick="setAmount(10)">+$10</button>
      <button class="quick-btn" onclick="setAmount(50)">+$50</button>
      <button class="quick-btn" onclick="setAmount(100)">+$100</button>
      <button class="quick-btn" onclick="setAmount(250)">+$250</button>
    </div>

    <!-- Kalkil & Frè -->
    <div class="fee-summary">
      <div class="summary-row">
        <span>Frais de recharge fixe:</span>
        <strong style="color: #f59e0b;">2.98 USDT</strong>
      </div>
      <div class="summary-row">
        <span>Équivalent en Goud (Taux 138):</span>
        <strong id="htgEquivalentDisplay">0 HTG</strong>
      </div>
      <div class="summary-row total">
        <span>Montant net ajouté à la carte:</span>
        <strong id="netAddedDisplay">$0.00 USD</strong>
      </div>
    </div>
  </div>

  <!-- Bouton Konfime -->
  <button class="btn-submit-recharge" onclick="executeRecharge()">Confirmer le rechargement</button>

  <script>
    const HTG_RATE = 138;
    const RECHARGE_FEE = 2.98;

    function setAmount(val) {
      document.getElementById('rechargeInput').value = val;
      updateCalculations();
    }

    function updateCalculations() {
      const val = parseFloat(document.getElementById('rechargeInput').value) || 0;
      
      // Kalkil HTG
      const htgVal = (val * HTG_RATE).toLocaleString();
      document.getElementById('htgEquivalentDisplay').innerText = `${htgVal} HTG`;

      // Kalkil Net apre frè 2.98
      if (val > RECHARGE_FEE) {
        const net = (val - RECHARGE_FEE).toFixed(2);
        document.getElementById('netAddedDisplay').innerText = `$${net} USD`;
      } else {
        document.getElementById('netAddedDisplay').innerText = `$0.00 USD`;
      }
    }

    function executeRecharge() {
      const val = parseFloat(document.getElementById('rechargeInput').value);

      if (!val || val <= RECHARGE_FEE) {
        alert(`Veuillez entrer un montant supérieur aux frais de $${RECHARGE_FEE} USDT.`);
        return;
      }

      alert(`Succès! $${(val - RECHARGE_FEE).toFixed(2)} USD ont été ajoutés sur votre carte Visa.`);
    }
  </script>

</body>
</html>
