<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveCash - Accueil</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #051a10;
      color: #ffffff;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .user-welcome {
      font-size: 14px;
      color: #a7f3d0;
    }

    .user-name {
      font-size: 18px;
      font-weight: 800;
      color: #facc15;
    }

    .profile-icon {
      width: 42px;
      height: 42px;
      background: #0d2d1d;
      border: 1px solid #facc15;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #facc15;
      text-decoration: none;
    }

    .balance-card {
      background: linear-gradient(135deg, #0d2d1d, #123d28);
      border: 1px solid #facc15;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .balance-title {
      font-size: 12px;
      color: #a7f3d0;
      font-weight: 700;
      text-transform: uppercase;
    }

    .balance-amount {
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      margin: 8px 0;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .action-card {
      background: #0d2d1d;
      border: 1px solid rgba(250, 204, 21, 0.25);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
      text-decoration: none;
      color: #ffffff;
      transition: transform 0.2s ease;
    }

    .action-card:active {
      transform: scale(0.96);
    }

    .action-icon {
      font-size: 24px;
      margin-bottom: 6px;
    }

    .action-label {
      font-size: 11px;
      font-weight: 700;
      color: #a7f3d0;
    }

    .section-title {
      font-size: 16px;
      font-weight: 800;
      color: #facc15;
      margin-bottom: 12px;
    }

    .card-banner {
      background: linear-gradient(135deg, #123d28, #0d2d1d);
      border: 1px solid rgba(250, 204, 21, 0.3);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .btn-order-now {
      background: linear-gradient(135deg, #facc15, #ca8a04);
      color: #051a10;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 12px;
      text-decoration: none;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: #0d2d1d;
      border-top: 1px solid rgba(250, 204, 21, 0.25);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #8fa89b;
      font-size: 10px;
      font-weight: 600;
    }

    .nav-item.active {
      color: #facc15;
    }

    .nav-icon {
      font-size: 18px;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <div class="top-header">
    <div>
      <div class="user-welcome">Bienvenue,</div>
      <div class="user-name" id="user-display-name">Membre LiveCash</div>
    </div>
    <a href="profil.html" class="profile-icon">👤</a>
  </div>

  <div class="balance-card">
    <div class="balance-title">Solde Principal (HTG)</div>
    <div class="balance-amount" id="user-balance-htg">0.00 HTG</div>
  </div>

  <div class="quick-actions">
    <a href="carte.html" class="action-card">
      <div class="action-icon">💳</div>
      <div class="action-label">Ma Carte</div>
    </a>
    <a href="commander-carte.html" class="action-card">
      <div class="action-icon">➕</div>
      <div class="action-label">Commander</div>
    </a>
    <a href="services.html" class="action-card">
      <div class="action-icon">⚡</div>
      <div class="action-label">Services</div>
    </a>
  </div>

  <div class="section-title">Carte Virtuelle VISA</div>
  <div class="card-banner">
    <div>
      <div style="font-weight: 800; font-size: 15px; color: #ffffff;">LiveCash Virtual VISA</div>
      <div style="font-size: 11px; color: #a7f3d0; margin-top: 2px;">Payez en ligne en toute sécurité</div>
    </div>
    <a href="commander-carte.html" class="btn-order-now">Commander</a>
  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <span class="nav-icon">🏠</span>
      <span>Accueil</span>
    </a>
    <a href="carte.html" class="nav-item">
      <span class="nav-icon">💳</span>
      <span>Cartes</span>
    </a>
    <a href="services.html" class="nav-item">
      <span class="nav-icon">🚀</span>
      <span>Services</span>
    </a>
    <a href="profil.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>Profil</span>
    </a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHLErZaBjAyCwtB0dCDSNhw9OGwi8qf98",
      authDomain: "livecash-app.firebaseapp.com",
      projectId: "livecash-app",
      storageBucket: "livecash-app.firebasestorage.app",
      messagingSenderId: "922574187666",
      appId: "1:922574187666:web:f56a38e19d2b6b51038a4b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const userDocRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userDocRef);
        if (userSnap.exists()) {
          const data = userSnap.data();
          document.getElementById('user-balance-htg').textContent = `${(data.balance || 0).toLocaleString('fr-FR')} HTG`;
          if (data.firstName) {
            document.getElementById('user-display-name').textContent = `${data.firstName} ${data.lastName || ''}`;
          }
        }
      }
    });
  </script>
</body>
</html>
