<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveCash - Bienvenue</title>
  <style>
    :root {
      --bg-dark: #0a0c10;
      --card-bg: #12161f;
      --accent-gold: #d4af37;
      --text-white: #ffffff;
      --text-gray: #8a94a6;
      --border-color: #1e2532;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .container {
      max-width: 400px;
      margin: auto 0;
      width: 100%;
      text-align: center;
    }

    .logo-box {
      width: 80px;
      height: 80px;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--accent-gold);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 20px auto;
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      margin: 0 0 10px 0;
    }

    h1 span {
      color: var(--accent-gold);
    }

    p.subtitle {
      color: var(--text-gray);
      font-size: 15px;
      margin-bottom: 40px;
      line-height: 1.5;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-decoration: none;
      display: block;
      box-sizing: border-box;
    }

    .btn-primary {
      background: var(--accent-gold);
      color: #000;
    }

    .btn-secondary {
      background: var(--card-bg);
      color: var(--text-white);
      border: 1px solid var(--border-color);
    }

    .footer-text {
      text-align: center;
      color: var(--text-gray);
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-box">💳</div>
    <h1>Live<span>Cash</span></h1>
    <p class="subtitle">Kat Virtiyèl Visa & Sèvis Boostaj Rezo Sosyo an sekirite.</p>

    <div class="btn-group">
      <a href="login.html" class="btn btn-primary">Konekte →</a>
      <a href="register.html" class="btn btn-secondary">Kreye yon Kont</a>
    </div>
  </div>

  <div class="footer-text">
    Pwoteje ak sistèm chifram sekirize.
  </div>

</body>
</html>
