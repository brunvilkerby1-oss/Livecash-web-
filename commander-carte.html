<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveCash - Commander une Carte</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #0b1329;
      color: #ffffff;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Top Bar Navigation */
    .top-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .btn-back {
      width: 42px;
      height: 42px;
      background: #172445;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #ffffff;
      text-decoration: none;
    }

    .page-title {
      font-size: 18px;
      font-weight: 800;
      color: #38bdf8;
    }

    /* Banner / Card Preview */
    .card-preview {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 24px;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .card-type {
      font-size: 12px;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card-brand {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      margin-top: 10px;
    }

    .card-info-note {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 8px;
    }

    /* Form Styles */
    .form-container {
      background: #172445;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 20px;
    }

    .section-subtitle {
      font-size: 14px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 8px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }

    .form-control:focus {
      border-color: #38bdf8;
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group {
      flex: 1;
    }

    /* Phone Input Layout */
    .phone-group {
      display: flex;
      gap: 8px;
    }

    .phone-prefix {
      width: 35%;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 8px;
      color: #38bdf8;
      font-weight: 700;
      font-size: 13px;
      outline: none;
    }

    .phone-number {
      width: 65%;
    }

    /* KYC Upload Style */
    .kyc-box {
      border: 2px dashed rgba(56, 189, 248, 0.3);
      background: rgba(15, 23, 42, 0.6);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      margin-top: 6px;
    }

    .kyc-box input[type="file"] {
      display: none;
    }

    .kyc-icon {
      font-size: 24px;
      margin-bottom: 6px;
    }

    .kyc-text {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 600;
    }

    .kyc-subtext {
      font-size: 10px;
      color: #64748b;
      margin-top: 4px;
    }

    .file-name-display {
      font-size: 11px;
      color: #38bdf8;
      margin-top: 6px;
      font-weight: 700;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background: #38bdf8;
      color: #0b1329;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.2s;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="top-header">
    <a href="index.html" class="btn-back">←</a>
    <div class="page-title">Commander une Carte</div>
  </div>

  <!-- Aperçu Carte -->
  <div class="card-preview">
    <div class="card-type">LiveCash Virtual</div>
    <div class="card-brand">VISA CASH</div>
    <div class="card-info-note">Veuillez fournir des informations exactes pour la validation KYC.</div>
  </div>

  <!-- Formulaire de commande -->
  <form class="form-container" id="orderCardForm" onsubmit="handleCardOrder(event)">
    <div class="section-subtitle">1. Informations Personnelles</div>

    <div class="form-row">
      <div class="form-group">
        <label for="firstName">Prénom</label>
        <input type="text" id="firstName" class="form-control" placeholder="Jean" required>
      </div>
      <div class="form-group">
        <label for="lastName">Nom</label>
        <input type="text" id="lastName" class="form-control" placeholder="Dupont" required>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Adresse Email</label>
      <input type="email" id="email" class="form-control" placeholder="exemple@email.com" required>
    </div>

    <div class="form-group">
      <label for="password">Mot de passe du compte</label>
      <input type="password" id="password" class="form-control" placeholder="••••••••" required>
    </div>

    <div class="form-group">
      <label>Pays et Téléphone</label>
      <div class="phone-group">
        <select id="countryCode" class="phone-prefix" onchange="syncCountrySelect()">
          <option value="+509">🇭🇹 Haïti (+509)</option>
          <option value="+1">🇺🇸 USA / Canada (+1)</option>
          <option value="+1-809">🇩🇴 Rep. Dominicaine (+1)</option>
          <option value="+33">🇫🇷 France (+33)</option>
          <option value="+55">🇧🇷 Brésil (+55)</option>
          <option value="+56">🇨🇱 Chili (+56)</option>
          <option value="+590">🇬🇵 Guadeloupe (+590)</option>
          <option value="+596">🇲🇶 Martinique (+596)</option>
          <option value="+594">🇬🇫 Guyane (+594)</option>
          <option value="+243">🇨🇩 RDC (+243)</option>
          <option value="+225">🇨🇮 Côte d'Ivoire (+225)</option>
          <option value="+221">🇸🇳 Sénégal (+221)</option>
          <option value="+237">🇨🇲 Cameroun (+237)</option>
        </select>
        <input type="tel" id="phoneNumber" class="form-control phone-number" placeholder="3700 0000" required>
      </div>
    </div>

    <div class="section-subtitle" style="margin-top: 24px;">2. Adresse & Localisation</div>

    <div class="form-group">
      <label for="country">Pays de résidence</label>
      <select id="country" class="form-control">
        <option value="Haïti">Haïti</option>
        <option value="États-Unis">États-Unis</option>
        <option value="République Dominicaine">République Dominicaine</option>
        <option value="France">France</option>
        <option value="Brésil">Brésil</option>
        <option value="Chili">Chili</option>
        <option value="Autre">Autre pays</option>
      </select>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="city">Ville</label>
        <input type="text" id="city" class="form-control" placeholder="Port-au-Prince" required>
      </div>
      <div class="form-group">
        <label for="state">Département / État</label>
        <input type="text" id="state" class="form-control" placeholder="Ouest" required>
      </div>
    </div>

    <div class="form-group">
      <label for="zipCode">Code Postal</label>
      <input type="text" id="zipCode" class="form-control" placeholder="HT6110" required>
    </div>

    <div class="section-subtitle" style="margin-top: 24px;">3. Verification KYC</div>

    <div class="form-group">
      <label>Pièce d'identité (Passeport / CIN / Permis)</label>
      <div class="kyc-box" onclick="document.getElementById('kycFile').click()">
        <div class="kyc-icon">📁</div>
        <div class="kyc-text">Cliquez pour télécharger votre pièce</div>
        <div class="kyc-subtext">Formats acceptés : JPG, PNG, PDF (Max 5MB)</div>
        <div class="file-name-display" id="fileNameDisplay"></div>
      </div>
      <input type="file" id="kycFile" accept="image/*,.pdf" onchange="updateFileName(this)" required>
    </div>

    <button type="submit" class="btn-submit">Valider et Commander</button>
  </form>

  <script>
    // Montre non fichye a lè moun nan chwazi foto KYC li
    function updateFileName(input) {
      const display = document.getElementById('fileNameDisplay');
      if (input.files && input.files[0]) {
        display.innerText = "📄 Fichier sélectionné : " + input.files[0].name;
      } else {
        display.innerText = "";
      }
    }

    // Senkronize peyi a ak kòd telefòn nan
    function syncCountrySelect() {
      const prefix = document.getElementById('countryCode').value;
      const countrySelect = document.getElementById('country');
      if (prefix === '+509') countrySelect.value = 'Haïti';
      else if (prefix === '+1') countrySelect.value = 'États-Unis';
      else if (prefix === '+1-809') countrySelect.value = 'République Dominicaine';
      else if (prefix === '+33') countrySelect.value = 'France';
      else if (prefix === '+55') countrySelect.value = 'Brésil';
      else if (prefix === '+56') countrySelect.value = 'Chili';
    }

    // Soumisyon fòm nan
    function handleCardOrder(event) {
      event.preventDefault();
      
      const cardData = {
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('countryCode').value + ' ' + document.getElementById('phoneNumber').value,
        country: document.getElementById('country').value,
        city: document.getElementById('city').value,
        state: document.getElementById('state').value,
        zipCode: document.getElementById('zipCode').value,
        kycUploaded: true
      };

      // Sove done yo nan localStorage
      localStorage.setItem('cardOrderInfo', JSON.stringify(cardData));

      alert("Votre demande de carte a été soumise avec succès ! Validation KYC en cours.");
      window.location.href = "cartes.html";
    }
  </script>

</body>
</html>
