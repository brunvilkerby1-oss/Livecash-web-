<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveCash - Mon Profil</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: #051a10; color: #ffffff; padding: 16px; max-width: 480px; margin: 0 auto; padding-bottom: 90px; }

    .top-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .btn-back { width: 38px; height: 38px; background: #0d2d1d; border: 1px solid #facc15; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #facc15; text-decoration: none; font-weight: 800; }
    .page-title { font-size: 18px; font-weight: 800; color: #facc15; }

    /* Profile Card Header */
    .profile-card {
      background: linear-gradient(135deg, #0d2d1d, #123d28);
      border: 1px solid #facc15;
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .avatar-circle {
      width: 70px;
      height: 70px;
      background: #facc15;
      color: #051a10;
      font-size: 28px;
      font-weight: 800;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px auto;
    }

    .user-name { font-size: 18px; font-weight: 800; color: #ffffff; }
    .user-email { font-size: 12px; color: #a7f3d0; margin-bottom: 10px; }

    /* ID Box with Copy Button */
    .id-box {
      background: #051a10;
      border: 1px dashed #facc15;
      border-radius: 10px;
      padding: 8px 12px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 5px;
    }

    .id-text { font-size: 13px; font-weight: 700; color: #facc15; letter-spacing: 1px; }
    .btn-copy { background: #facc15; color: #051a10; border: none; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; cursor: pointer; }

    /* Info Sections */
    .info-group { background: #0d2d1d; border: 1px solid rgba(250, 204, 21, 0.25); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    .info-row { display: flex; justify-content: space-between; font-size: 13px; padding: 8px 0; border-bottom: 1px solid rgba(250, 204, 21, 0.1); }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #8fa89b; font-weight: 500; }
    .info-val { color: #ffffff; font-weight: 700; }

    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #0d2d1d; border-top: 1px solid rgba(250, 204, 21, 0.25); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #8fa89b; font-size: 10px; font-weight: 600; }
    .nav-item.active { color: #facc15; }
    .nav-icon { font-size: 18px; margin-bottom: 2px; }
  </style>
</head>
<body>

  <div class="top-header">
    <a href="index.html" class="btn-back">←</a>
    <div class="page-title">Mon Profil</div>
  </div>

  <div class="profile-card">
    <div class="avatar-circle">U</div>
    <div class="user-name" id="userName">Utilisateur LiveCash</div>
    <div class="user-email" id="userEmail">user@gmail.com</div>

    <!-- ID Compte Unique -->
    <div class="id-box">
      <span>ID Compte :</span>
      <span class="id-text" id="livecashID">LC-78492</span>
      <button class="btn-copy" onclick="copyID()">KOPYE</button>
    </div>
  </div>

  <div class="info-group">
    <div class="info-row">
      <span class="info-label">Statut du compte</span>
      <span class="info-val" style="color: #4ade80;">✔ Vérifié</span>
    </div>
    <div class="info-row">
      <span class="info-label">Téléphone</span>
      <span class="info-val">+509 ---- ----</span>
    </div>
    <div class="info-row">
      <span class="info-label">Pays</span>
      <span class="info-val">Haïti 🇭🇹</span>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>Accueil</span>
    </a>
    <a href="cartes.html" class="nav-item">
      <span class="nav-icon">💳</span>
      <span>Cartes</span>
    </a>
    <a href="boostage.html" class="nav-item">
      <span class="nav-icon">🚀</span>
      <span>Boost</span>
    </a>
    <a href="profil.html" class="nav-item active">
      <span class="nav-icon">👤</span>
      <span>Profil</span>
    </a>
  </div>

  <script>
    function copyID() {
      const idText = document.getElementById('livecashID').innerText;
      navigator.clipboard.writeText(idText);
      alert("✅ ID LiveCash kopye : " + idText);
    }
  </script>
</body>
</html>
