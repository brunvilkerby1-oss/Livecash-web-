<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveCash - Boostaj Rezo Sosyo</title>
  <style>
    :root {
      --bg-dark: #0a0c10;
      --card-bg: #12161f;
      --accent-gold: #d4af37;
      --text-white: #ffffff;
      --text-gray: #8a94a6;
      --border-color: #1e2532;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-white); margin: 0; padding: 16px; padding-bottom: 90px; }

    .app-container { max-width: 420px; margin: 0 auto; }

    /* Top Bar */
    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .back-btn { text-decoration: none; color: var(--text-white); font-size: 20px; }
    .page-title { font-size: 18px; font-weight: 700; margin: 0; }

    /* Platform Selector Tabs */
    .platform-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; }
    .tab-btn {
      background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-gray);
      padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .tab-btn.active { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); }

    /* Form Card */
    .form-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 20px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; color: var(--text-gray); font-size: 13px; margin-bottom: 8px; font-weight: 600; }
    
    select, input {
      width: 100%; padding: 14px; background: #0a0c10; border: 1px solid var(--border-color);
      border-radius: 12px; color: var(--text-white); font-size: 14px; outline: none;
    }
    select:focus, input:focus { border-color: var(--accent-gold); }

    /* Price Calculation Box */
    .price-box {
      background: rgba(212, 175, 55, 0.08); border: 1px dashed var(--accent-gold);
      border-radius: 14px; padding: 16px; text-align: center; margin: 20px 0;
    }
    .price-label { font-size: 12px; color: var(--text-gray); text-transform: uppercase; }
    .price-amount { font-size: 24px; font-weight: 800; color: var(--accent-gold); margin-top: 4px; }

    .btn-submit {
      width: 100%; padding: 16px; background: var(--accent-gold); color: #000;
      font-weight: 800; border: none; border-radius: 14px; cursor: pointer; font-size: 15px;
    }

    /* Bottom Navbar */
    .navbar {
      position: fixed; bottom: 0; left: 0; right: 0; background: #0e121a;
      border-top: 1px solid var(--border-color); display: flex; justify-content: space-around;
      padding: 12px 0; max-width: 420px; margin: 0 auto;
    }
    .nav-item { text-align: center; color: var(--text-gray); text-decoration: none; font-size: 11px; }
    .nav-item.active { color: var(--accent-gold); font-weight: bold; }
    .nav-icon { font-size: 20px; display: block; margin-bottom: 3px; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Top Bar -->
  <div class="top-bar">
    <a href="dashboard.html" class="back-btn">←</a>
    <h1 class="page-title">Boostaj Rezo Sosyo</h1>
    <div style="width:20px;"></div>
  </div>

  <!-- Platform Selector -->
  <div class="platform-tabs">
    <button class="tab-btn active" onclick="selectPlatform('TikTok')">🎵 TikTok</button>
    <button class="tab-btn" onclick="selectPlatform('Instagram')">📸 Instagram</button>
    <button class="tab-btn" onclick="selectPlatform('Facebook')">📘 Facebook</button>
    <button class="tab-btn" onclick="selectPlatform('YouTube')">▶️ YouTube</button>
  </div>

  <!-- Main Order Form -->
  <div class="form-card">
    <form onsubmit="event.preventDefault(); placeOrder();">
      <div class="form-group">
        <label>Kalite Sèvis</label>
        <select id="serviceSelect" onchange="calculatePrice()">
          <option value="followers">Abonnés / Followers (Sèvis Rapid)</option>
          <option value="likes">J'aime / Likes (Moun Reyèl)</option>
          <option value="views">Vues / Views (Livrezon Instantane)</option>
          <option value="comments">Kòmantè Pèsonalize</option>
        </select>
      </div>

      <div class="form-group">
        <label>Lien Paj oswa Kont ou (URL)</label>
        <input type="url" placeholder="https://www.tiktok.com/@username" required>
      </div>

      <div class="form-group">
        <label>Kantite ou vle a</label>
        <input type="number" id="quantityInput" value="1000" min="100" step="100" oninput="calculatePrice()" required>
      </div>

      <!-- Price Box -->
      <div class="price-box">
        <div class="price-label">Prix Total estime</div>
        <div class="price-amount" id="totalPriceDisplay">$2.50 USD</div>
      </div>

      <button type="submit" class="btn-submit">Lanse Komand lan 🚀</button>
    </form>
  </div>
</div>

<!-- Bottom Navbar -->
<div class="navbar">
  <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span>Akèy</a>
  <a href="card.html" class="nav-item"><span class="nav-icon">💳</span>Kat</a>
  <a href="boost.html" class="nav-item active"><span class="nav-icon">🚀</span>Boost</a>
  <a href="#" class="nav-item"><span class="nav-icon">👤</span>Pwofil</a>
</div>

<script>
  function selectPlatform(platformName) {
    const tabs = document.querySelectorAll('.tab-btn');
    tabs.forEach(tab => tab.classList.remove('active'));
    event.target.classList.add('active');
    calculatePrice();
  }

  function calculatePrice() {
    const qty = document.getElementById('quantityInput').value || 0;
    const service = document.getElementById('serviceSelect').value;
    
    let rate = 0.0025; // Prix de base pa Inite
    if (service === 'likes') rate = 0.0015;
    if (service === 'views') rate = 0.0005;
    if (service === 'comments') rate = 0.0100;

    const total = (qty * rate).toFixed(2);
    document.getElementById('totalPriceDisplay').innerText = `$${total} USD`;
  }

  function placeOrder() {
    alert("Komand ou an anrejistre an mòd tès! Lè nou fin konekte backend lan, l ap dekonte sou solde pwofil ou.");
  }
</script>

</body>
</html>
