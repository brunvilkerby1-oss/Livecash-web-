<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveCash - Kreye Kont</title>
  <style>
    :root {
      --bg-dark: #0a0c10;
      --card-bg: #12161f;
      --accent-gold: #d4af37;
      --text-white: #ffffff;
      --text-gray: #8a94a6;
      --border-color: #1e2532;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .container {
      max-width: 400px;
      margin: auto;
      width: 100%;
    }

    .top-bar {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .back-btn {
      color: var(--text-white);
      text-decoration: none;
      font-size: 24px;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 8px 0;
    }

    p.subtitle {
      color: var(--text-gray);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      color: var(--text-gray);
      font-size: 13px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      color: var(--text-white);
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent-gold);
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      background: var(--accent-gold);
      color: #000;
      margin-top: 10px;
      text-decoration: none;
      display: block;
      text-align: center;
    }

    .switch-auth {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-gray);
    }

    .switch-auth a {
      color: var(--accent-gold);
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <a href="index.html" class="back-btn">←</a>
    </div>

    <h1>Kreye Kont <span style="color: var(--accent-gold);">LiveCash</span></h1>
    <p class="subtitle">Rempli ti fòm sa a pou w ka kòmanse sèvi ak sèvis yo.</p>

    <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
      <div class="form-group">
        <label>Non ak Siyen</label>
        <input type="text" placeholder="Jan Batis" required>
      </div>

      <div class="form-group">
        <label>Nimewo Telefòn</label>
        <input type="tel" placeholder="+509 XXXX XXXX" required>
      </div>

      <div class="form-group">
        <label>Mòdpas</label>
        <input type="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">Siyen epi Kontiye →</button>
    </form>

    <div class="switch-auth">
      Ou gen yon kont deja? <a href="login.html">Konekte</a>
    </div>
  </div>

</body>
</html>
