<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveCash - Transfert</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #071a12;
      color: #ffffff;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    /* Top Bar Header */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      background: #0f3322;
      border: 1px solid #facc15;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      color: #facc15;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .logo-text {
      font-size: 20px;
      font-weight: 800;
      color: #facc15;
    }

    /* Container Form */
    .form-card {
      background: #0f3322;
      border: 1px solid rgba(250, 204, 21, 0.25);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .card-title {
      font-size: 16px;
      font-weight: 800;
      color: #facc15;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-subtitle {
      font-size: 12px;
      color: #a7f3d0;
      margin-bottom: 18px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .form-group input, .form-group select {
      width: 100%;
      background: #071a12;
      border: 1px solid rgba(250, 204, 21, 0.3);
      border-radius: 10px;
      padding: 12px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      outline: none;
    }

    .form-group input:focus {
      border-color: #facc15;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #facc15, #ca8a04);
      color: #071a12;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(250, 204, 21, 0.25);
    }

    /* Recipient Info Box */
    .recipient-preview {
      display: none;
      background: rgba(250, 204, 21, 0.1);
      border: 1px dashed #facc15;
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      color: #a7f3d0;
      margin-top: -10px;
      margin-bottom: 16px;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: #092418;
      border-top: 1px solid rgba(250, 204, 21, 0.3);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 600;
    }

    .nav-item.active {
      color: #facc15;
    }

    .nav-icon {
      font-size: 18px;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="top-header">
    <div class="brand-section">
      <a href="index.html" class="back-btn">←</a>
      <div class="logo-text">Transfert LiveCash</div>
    </div>
  </div>

  <!-- Formulaire de transfert -->
  <div class="form-card">
    <div class="card-title">💸 Envoyer des fonds</div>
    <div class="card-subtitle">Transférez de l'argent instantanément vers un autre compte LiveCash.</div>

    <form id="transferForm" onsubmit="processTransfer(event)">
      <div class="form-group">
        <label>ID du destinataire (Ex: LC-12345)</label>
        <input type="text" id="recipientID" placeholder="Entrez l'ID du destinataire" required oninput="checkRecipient()">
      </div>

      <div class="recipient-preview" id="recipientPreview">
        👤 Destinataire: <strong id="recipientName" style="color: #facc15;">--</strong>
      </div>

      <div class="form-group">
        <label>Montant à envoyer (HTG)</label>
        <input type="number" id="transferAmount" placeholder="Montant en HTG" min="10" required>
      </div>

      <div class="form-group">
        <label>Note / Motif (Optionnel)</label>
        <input type="text" id="transferNote" placeholder="Ex: Paiement service">
      </div>

      <button type="submit" class="btn-submit">Confirmer le Transfert</button>
    </form>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>Accueil</span>
    </a>
    <a href="carte.html" class="nav-item">
      <span class="nav-icon">💳</span>
      <span>Carte</span>
    </a>
    <a href="boostage.html" class="nav-item">
      <span class="nav-icon">🚀</span>
      <span>Boost</span>
    </a>
    <a href="transactions.html" class="nav-item active">
      <span class="nav-icon">💸</span>
      <span>Transfert</span>
    </a>
  </div>

  <script>
    function checkRecipient() {
      const id = document.getElementById('recipientID').value.trim();
      const preview = document.getElementById('recipientPreview');
      const name = document.getElementById('recipientName');

      if (id.length >= 5) {
        preview.style.display = 'block';
        name.innerText = "Utilisateur LiveCash (" + id.toUpperCase() + ")";
      } else {
        preview.style.display = 'none';
      }
    }

    function processTransfer(e) {
      e.preventDefault();
      const id = document.getElementById('recipientID').value.trim();
      const amount = parseFloat(document.getElementById('transferAmount').value);

      const user = JSON.parse(localStorage.getItem('currentUser')) || { balanceHTG: 0 };

      if (amount > user.balanceHTG) {
        alert("❌ Solde insuffisant pour effectuer ce transfert.");
        return;
      }

      user.balanceHTG -= amount;
      localStorage.setItem('currentUser', JSON.stringify(user));

      alert(`✅ Transfert de ${amount} HTG envoyé avec succès à l'ID ${id}!`);
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
