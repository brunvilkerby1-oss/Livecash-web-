<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveCash - Historique</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: #051a10; color: #ffffff; padding: 16px; max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 90px; }

    .top-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .btn-back { width: 42px; height: 42px; background: #0d2d1d; border: 1px solid #facc15; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #facc15; text-decoration: none; font-weight: 800; }
    .page-title { font-size: 19px; font-weight: 800; color: #facc15; }

    .tx-card {
      background: #0d2d1d;
      border: 1px solid rgba(250, 204, 21, 0.25);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tx-details { display: flex; flex-direction: column; gap: 4px; }
    .tx-title { font-size: 14px; font-weight: 700; color: #ffffff; }
    .tx-date { font-size: 11.5px; color: #a7f3d0; }
    
    .tx-amount { font-size: 15px; font-weight: 800; }
    .tx-out { color: #f87171; }
    .tx-in { color: #4ade80; }

    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #0d2d1d; border-top: 1px solid rgba(250, 204, 21, 0.25); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #8fa89b; font-size: 10px; font-weight: 600; }
    .nav-item.active { color: #facc15; }
    .nav-icon { font-size: 18px; margin-bottom: 2px; }
  </style>
</head>
<body>

  <div class="top-header">
    <a href="index.html" class="btn-back">←</a>
    <div class="page-title">Historique des Activités</div>
  </div>

  <div class="tx-card">
    <div class="tx-details">
      <span class="tx-title">🚀 Boostage TikTok</span>
      <span class="tx-date">Aujourd'hui, 10:15</span>
    </div>
    <span class="tx-amount tx-out">-500 HTG</span>
  </div>

  <div class="tx-card">
    <div class="tx-details">
      <span class="tx-title">💳 Création Carte Visa Cash</span>
      <span class="tx-date">Hier, 18:30</span>
    </div>
    <span class="tx-amount tx-out">-$5.00</span>
  </div>

  <div class="tx-card">
    <div class="tx-details">
      <span class="tx-title">📥 Dépôt MonCash</span>
      <span class="tx-date">02 Sep 2026, 14:20</span>
    </div>
    <span class="tx-amount tx-in">+2,500 HTG</span>
  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>Accueil</span>
    </a>
    <a href="cartes.html" class="nav-item">
      <span class="nav-icon">💳</span>
      <span>Cartes</span>
    </a>
    <a href="boostage.html" class="nav-item">
      <span class="nav-icon">🚀</span>
      <span>Boost</span>
    </a>
    <a href="profil.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>Profil</span>
    </a>
  </div>

</body>
</html>
